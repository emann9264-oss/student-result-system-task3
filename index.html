<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة النتائج</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="main.js" defer></script>
</head>

<body>

    <div class="container mt-4 p-4 bg-white shadow rounded">

        <h1 class="text-center text-primary mb-4">
            نظام إدارة النتائج
        </h1>

        <div class="form mx-auto">

            <h2 class="text-center mb-3">إضافة طالب جديد</h2>

            <label class="form-label">اسم الطالب</label>
            <input type="text" id="studentName" class="form-control mb-3"
                placeholder="أدخل اسم الطالب">

            <label class="form-label">درجة المادة الأولى</label>
            <input type="number" id="grade1" class="form-control mb-3"
                placeholder="أدخل الدرجة">

            <label class="form-label">درجة المادة الثانية</label>
            <input type="number" id="grade2" class="form-control mb-3"
                placeholder="أدخل الدرجة">

            <label class="form-label">درجة المادة الثالثة</label>
            <input type="number" id="grade3" class="form-control mb-3"
                placeholder="أدخل الدرجة">

            <label class="form-label">نسبة الحضور</label>
            <input type="number" id="attendance" class="form-control mb-3"
                placeholder="أدخل نسبة الحضور">

            <button type="button" id="addStudent"
                class="btn btn-success w-100 mb-2">
                إضافة طالب
            </button>

            <button type="button" id="activateCommittee"
                class="btn btn-primary w-100">
                تفعيل لجنة الرأفة
            </button>

        </div>

        <div id="error" class="text-danger text-center mt-3"></div>

        <hr>

        <h2 class="text-center text-success">قائمة الطلاب</h2>

        <div id="studentList" class="p-3 border rounded mb-4"></div>

        <h2 class="text-center text-success">التقرير النهائي للجنة الرأفة</h2>

        <div id="committeeReport" class="p-3 border rounded mt-3"></div>

    </div>

</body>
</html>
